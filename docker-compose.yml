services:
  web:
    build: .
    image: luma-tech-solutions:latest
    container_name: luma-tech-solutions-web
    ports:
      - "8005:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me-in-production}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-lumatechsolutions.co.uk,www.lumatechsolutions.co.uk,localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-https://lumatechsolutions.co.uk,https://www.lumatechsolutions.co.uk}"
      SITE_URL: "${SITE_URL:-https://lumatechsolutions.co.uk}"
      SITE_EMAIL: "${SITE_EMAIL:-hello@lumatechsolutions.co.uk}"
      SITE_PHONE: "${SITE_PHONE:-}"
      DJANGO_EMAIL_BACKEND: "${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      DJANGO_EMAIL_HOST: "${DJANGO_EMAIL_HOST:-}"
      DJANGO_EMAIL_PORT: "${DJANGO_EMAIL_PORT:-587}"
      DJANGO_EMAIL_HOST_USER: "${DJANGO_EMAIL_HOST_USER:-}"
      DJANGO_EMAIL_HOST_PASSWORD: "${DJANGO_EMAIL_HOST_PASSWORD:-}"
      DJANGO_EMAIL_USE_TLS: "${DJANGO_EMAIL_USE_TLS:-1}"
      DJANGO_EMAIL_USE_SSL: "${DJANGO_EMAIL_USE_SSL:-0}"
      DJANGO_DEFAULT_FROM_EMAIL: "${DJANGO_DEFAULT_FROM_EMAIL:-Luma Tech Solutions <hello@lumatechsolutions.co.uk>}"
      CONTACT_FORM_RECIPIENT: "${CONTACT_FORM_RECIPIENT:-hello@lumatechsolutions.co.uk}"
      LUMA_BLOG_API_KEY: "${LUMA_BLOG_API_KEY:-}"
      RECAPTCHA_SITE_KEY: "${RECAPTCHA_SITE_KEY:-6Leel9wsAAAAAOCRw7b0t5Gj939fy8fy25ZFRXnU}"
      RECAPTCHA_SECRET_KEY: "${RECAPTCHA_SECRET_KEY:-}"
      RECAPTCHA_MIN_SCORE: "${RECAPTCHA_MIN_SCORE:-0.5}"
    volumes:
      - luma-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  luma-data:
